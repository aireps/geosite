name: Notify failure
description: Sends a Telegram message when a workflow run fails.

inputs:
  token:
    description: Telegram bot token. Leave empty to skip the notification.
    required: false
    default: ""
  chat-id:
    description: Telegram chat to post into. Leave empty to skip the notification.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TELEGRAM_TOKEN: ${{ inputs.token }}
        TELEGRAM_CHAT_ID: ${{ inputs.chat-id }}
      # Never fail the job from here. The run is already failing by the time
      # this executes, and a second error would only bury the first one.
      run: |
        set -uo pipefail
        if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
          echo "::warning::Telegram secrets are unset, skipping the failure notification"
          exit 0
        fi
        text="${GITHUB_REPOSITORY}: ${GITHUB_WORKFLOW} failed
        ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        if ! curl -fsS --retry 3 --retry-delay 2 -o /dev/null \
          -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=${text}"; then
          echo "::warning::Could not deliver the Telegram notification"
        fi
