# Manifest of external data sources to aggregate into data/.
#
# Each source declares where to fetch a file from and where to write it
# under data/. The .github/scripts/sync_sources.py script reads this file,
# fetches each source, compares SHA256 with the existing target, and writes
# changed files atomically. The .github/workflows/sync-sources.yml workflow
# runs the script daily and commits any changes, then triggers build.yml.
#
# Schema:
#   sources:
#     - name: <human label, must be unique>
#       type: github_raw | url
#       repo: <owner/repo>           # required when type=github_raw
#       ref: <branch or tag>         # required when type=github_raw
#       path: <path inside repo>     # required when type=github_raw
#       url: <full URL>              # required when type=url
#       target: <path under repo>    # required, where to write the file
#       min_bytes: <int>             # optional, reject responses smaller than this
#
# Important: every `include:NAME` in a fetched file must resolve to a
# file present in data/ at build time. List transitive dependencies
# explicitly here.
#
# About min_bytes: the sync script rejects a response that looks like markup
# (an HTML or XML error page served with 200) and, when min_bytes is set, one
# that is implausibly small. Thresholds follow the "clearly too small to be
# real" rule rather than tracking the expected size, so that a legitimate
# upstream shrink does not trip them. For the tiny lists the size check is
# weak by nature — an error page is larger than the file itself — and the
# markup check is what actually guards them.
sources:
  - name: category-ip-geo-detect
    # IP geolocation domains, used in xray_sub_formats.py DirectSites.
    # Was a static local copy; now refreshed from v2fly upstream.
    type: github_raw
    repo: v2fly/domain-list-community
    ref: master
    path: data/category-ip-geo-detect
    target: data/category-ip-geo-detect
    min_bytes: 600

  - name: ipip
    # Transitive dependency: data/category-ip-geo-detect contains `include:ipip`.
    # Without data/ipip the geosite-builder fails on missing include.
    type: github_raw
    repo: v2fly/domain-list-community
    ref: master
    path: data/ipip
    target: data/ipip
    min_bytes: 10

  - name: yandex
    # Used in config-ru.json.j2 routing/DNS rules (geosite:yandex → direct).
    type: github_raw
    repo: v2fly/domain-list-community
    ref: master
    path: data/yandex
    target: data/yandex
    min_bytes: 600

  - name: kinopoisk
    # Transitive dependency: data/yandex contains `include:kinopoisk`.
    type: github_raw
    repo: v2fly/domain-list-community
    ref: master
    path: data/kinopoisk
    target: data/kinopoisk
    min_bytes: 15

  - name: vk
    # Used in config-ru.json.j2 routing/DNS rules (geosite:vk → direct).
    type: github_raw
    repo: v2fly/domain-list-community
    ref: master
    path: data/vk
    target: data/vk
    min_bytes: 250

  - name: category-gov-ru
    # Used in config-ru.json.j2 routing/DNS rules (geosite:category-gov-ru → direct).
    type: github_raw
    repo: v2fly/domain-list-community
    ref: master
    path: data/category-gov-ru
    target: data/category-gov-ru
    min_bytes: 2000

  - name: category-ads
    # Ad/tracking blocklist from hagezi (Light by default).
    # ~42k base domains, daily updates. Self-contained flat list, no includes.
    # To switch to a wider tier: multi-onlydomains (~181k), pro-onlydomains
    # (~216k) or pro.plus-onlydomains (~239k) in the same directory.
    # Source: https://github.com/hagezi/dns-blocklists
    #
    # Upstream removed the domains/ directory around 31 Jul 2026, which broke
    # the previous path domains/light.txt with a 404. The plain-domain list now
    # lives under wildcard/ as *-onlydomains.txt. It carries base domains only,
    # which is the right shape here: the geosite generator maps a prefix-less
    # line to Domain_RootDomain, and Xray matches that against the domain plus
    # any subdomain, so enumerating subdomains is redundant.
    type: github_raw
    repo: hagezi/dns-blocklists
    ref: main
    path: wildcard/light-onlydomains.txt
    target: data/category-ads
    min_bytes: 300000
